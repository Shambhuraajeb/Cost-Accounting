<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        .navbar {
            background-color: #1a237e;
        }
        .navbar-brand {
            color: #fff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Cost Accounting ERP</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2>Budget Management</h2>
        <form>
            <div class="mb-3">
                <label for="project" class="form-label">Project</label>
                <input type="text" class="form-control" id="project" placeholder="Enter project name">
            </div>
            <div class="mb-3">
                <label for="budget" class="form-label">Budget Amount</label>
                <input type="number" class="form-control" id="budget" placeholder="Enter budget amount">
            </div>
            <button type="submit" class="btn btn-primary" style="background-color: #1a237e;">Submit Budget</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
