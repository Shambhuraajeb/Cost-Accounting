<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ERP Project Entry</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background-color: #f4f6f9;
                color: #333;
                font-family: Arial, sans-serif;
            }
            .navbar {
                background-color: #343a40;
            }
            .navbar-brand {
                color: #fff;
            }
            .form-container {
                margin-top: 30px;
                background-color: #ffffff;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }
            .form-title {
                color: #007bff;
                border-bottom: 2px solid #007bff;
                padding-bottom: 10px;
            }
            .form-section {
                background-color: #f8f9fa;
                padding: 15px;
                margin-bottom: 15px;
                border-radius: 8px;
                border: 1px solid #ced4da;
            }
            .form-section h5 {
                color: #343a40;
                margin-bottom: 15px;
            }
            .form-label {
                font-weight: bold;
            }
            .btn-primary {
                background-color: #007bff;
                border-color: #007bff;
                font-weight: bold;
            }
            .btn-primary:hover {
                background-color: #0056b3;
                border-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Cost Accounting ERP</a>
            </div>
        </nav>

        <!-- Form Container -->
        <div class="container form-container">
            <h2 class="form-title">Project Entry</h2>
            <form method="post" action="/Cost/accountantserv/Project">
                <!-- Project Information Section -->
                <div class="form-section">
                    <h5>Project Information</h5>
                    <div class="row">

                        <!-- Project Name -->
                        <div class="col-md-6 mb-3">
                            <label for="projectName" class="form-label">Project Name</label>
                            <input type="text" class="form-control" id="projectName" name="projectName" placeholder="Enter project name" required>
                        </div>
                    </div>
                </div>

                <!-- Date Information Section -->
                <div class="form-section">
                    <h5>Date Information</h5>
                    <div class="row">
                        <!-- Start Date -->
                        <div class="col-md-6 mb-3">
                            <label for="startDate" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="startDate" name="startDate" required>
                        </div>
                        <!-- End Date -->
                        <div class="col-md-6 mb-3">
                            <label for="endDate" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="endDate" name="endDate" required>
                        </div>
                    </div>
                </div>

                <!-- Project Description Section -->
                <div class="form-section">
                    <h5>Project Details</h5>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Enter project description" required></textarea>
                    </div>
                </div>

                <!-- Budget Section -->
                <div class="form-section">
                    <h5>Budget Information</h5>
                    <div class="mb-3">
                        <label for="budgetAmount" class="form-label">Budget Amount</label>
                        <input type="number" class="form-control" id="budgetAmount" name="budgetAmount" placeholder="Enter budget amount" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Submit Project</button>
                </div>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
