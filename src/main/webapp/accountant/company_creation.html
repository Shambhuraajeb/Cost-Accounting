<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Creation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .form-header h1 {
            font-size: 28px;
            color: #343a40;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1a237e;
            padding-bottom: 10px;
        }

        .erp-form {
            margin-top: 10px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-row label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #495057;
        }

        .form-row input,
        .form-row select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: #f8f9fa;
            transition: border-color 0.3s;
        }

        .form-row input:focus,
        .form-row select:focus {
            border-color: #1a237e;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: white;
            background-color: #1a237e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #0d1b40;
            transform: scale(1.02);
        }

        /* Responsive design: Adjust for smaller devices */
        @media (min-width: 600px) {
            .form-row {
                flex-direction: row;
                justify-content: space-between;
            }

            .form-row label {
                width: 45%;
            }

            .form-row input,
            .form-row select {
                width: 45%;
            }

            .form-row:last-child {
                justify-content: center;
            }

            button {
                width: 50%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-header">
            <h1>Company Creation</h1>
        </div>
        <form class="erp-form" method="post" action="/Cost/accountantserv/CompanyCreation">
            <div class="form-row">
                <label for="companyName">Company Name:</label>
                <input type="text" id="companyName" name="companyName" placeholder="Enter company name" required>
            </div>
            <div class="form-row">
                <label for="financialYear">Financial Year Beginning From:</label>
                <input type="date" id="financialYear" name="financialYear" required>
            </div>
            <div class="form-row">
                <label for="mailingName">Mailing Name:</label>
                <input type="text" id="mailingName" name="mailingName" placeholder="Enter mailing name">
            </div>
            <div class="form-row">
                <label for="booksFrom">Books Beginning From:</label>
                <input type="date" id="booksFrom" name="booksFrom" required>
            </div>
            <div class="form-row">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" placeholder="Enter address">
            </div>
            <div class="form-row">
                <label for="state">State:</label>
                <select id="state" name="state">
                    <option value="Not Applicable">♦ Not Applicable</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Maharashtra" selected>Maharashtra</option>
                    <!-- Add other states here -->
                </select>
            </div>
            <div class="form-row">
                <label for="country">Country:</label>
                <input type="text" id="country" name="country" value="India" readonly>
            </div>
            <div class="form-row">
                <label for="pincode">Pincode:</label>
                <input type="text" id="pincode" name="pincode" placeholder="Enter pincode">
            </div>
            <div class="form-row">
                <label for="telephone">Telephone:</label>
                <input type="tel" id="telephone" name="telephone" placeholder="Enter telephone number">
            </div>
            <div class="form-row">
                <label for="mobile">Mobile:</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number">
            </div>
            <div class="form-row">
                <label for="fax">Fax:</label>
                <input type="text" id="fax" name="fax" placeholder="Enter fax number">
            </div>
            <div class="form-row">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Enter email">
            </div>
            <div class="form-row">
                <label for="website">Website:</label>
                <input type="url" id="website" name="website" placeholder="Enter website URL">
            </div>
            <div class="form-row">
                <label for="currencySymbol">Base Currency Symbol:</label>
                <input type="text" id="currencySymbol" name="currencySymbol" value="₹">
            </div>
            <div class="form-row">
                <label for="currencyName">Formal Name:</label>
                <input type="text" id="currencyName" name="currencyName" value="INR">
            </div>
            <div class="form-row">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
</body>

</html>
