<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Allocation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            color: #1a237e;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #1a237e;
        }
        .navbar-brand {
            color: #fff;
        }
        .form-container {
            margin-top: 30px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-title {
            color: #1a237e;
            border-bottom: 2px solid #1a237e;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            background-color: #1a237e;
            border-color: #1a237e;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #1a237e;
            border-color: #1a237e;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Cost Accounting ERP</a>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container form-container">
        <h2 class="form-title">Cost Allocation</h2>
        <form>
            <div class="mb-3">
                <label for="allocationBase" class="form-label">Allocation Base</label>
                <input type="text" class="form-control" id="allocationBase" name="allocationBaseName" placeholder="Enter allocation base" required>
            </div>
            <div class="mb-3">
                <label for="allocationMethod" class="form-label">Allocation Method</label>
                <select id="allocationMethod" name="allocationBaseType" class="form-select" required>
                    <option value="" selected disabled>Choose allocation method</option>
                    <option value="direct">Direct Allocation</option>
                    <option value="stepdown">Step-Down Method</option>
                </select>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Allocate Costs</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
